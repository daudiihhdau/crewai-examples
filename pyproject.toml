[project]
name = "crewai-claude-code-basic-examples"
version = "0.1.0"
description = "A staged CrewAI talk project with simple everyday Anthropic examples."
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[anthropic]>=0.175.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0.0",
]

[project.scripts]
crewai-examples = "examples.main:main"

[tool.ruff]
line-length = 100
